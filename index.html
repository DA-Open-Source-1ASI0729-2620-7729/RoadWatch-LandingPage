<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="RoadWatch - Automated environmental compliance and mitigation for highway construction."
  >

  <title>RoadWatch | Environmental Compliance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">

      <a href="#home" class="brand" aria-label="RoadWatch home">
        <div class="brand-logo">
          RW
        </div>

        <div class="brand-text">
          <strong>RoadWatch</strong>
          <span>
            SMART ENVIRONMENTAL MONITORING FOR ROAD INFRASTRUCTURE
          </span>
        </div>
      </a>

      <nav
        class="main-nav"
        id="mainNav"
        aria-label="Main navigation"
      >
        <a href="#home" data-i18n="nav.home">
          Home
        </a>

        <a href="#solutions" data-i18n="nav.solutions">
          Solutions
        </a>

        <a href="#benefits" data-i18n="nav.benefits">
          Benefits
        </a>

        <a href="#features" data-i18n="nav.features">
          Features
        </a>

        <a href="#plans" data-i18n="nav.plans">
          SaaS Plans
        </a>

        <a href="#case-studies" data-i18n="nav.cases">
          Case Studies
        </a>
      </nav>

      <div class="header-actions">

        <a
          href="#signin"
          class="signin-link"
          data-i18n="nav.signin"
        >
          Sign In
        </a>

        <a
          href="#demo"
          class="demo-btn"
          data-i18n="nav.demo"
        >
          Request Demo
        </a>

        <select
          id="languageSelect"
          class="lang-select"
          aria-label="Language"
        >
          <option value="en">
            EN
          </option>

          <option value="es">
            ES
          </option>
        </select>

        <button
          class="menu-toggle"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
        >
          ☰
        </button>

      </div>
    </div>
  </header>

  <main>

    <!-- Hero will be added in feature/hero -->
    <!-- Solutions will be added in feature/solutions -->
    <!-- Benefits will be added in feature/benefits -->
    <!-- Features will be added in feature/features -->
    <!-- Team will be added in feature/team -->
    <!-- Pricing will be added in feature/pricing -->
    <!-- Testimonials will be added in feature/testimonials -->

  </main>

  <!-- Footer will be added in feature/footer -->

  <script src="js/main.js"></script>
</body>
</html>
